[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "logreader-py"
dynamic = ["version"]
description = "Desktop and command-line tool for finding errors and context in log files"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
dependencies = [
    "PySide6>=6.7,<7",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: Win32 (MS Windows)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: System :: Logging",
]

[project.urls]
Repository = "https://github.com/PeterKon/logreader"

[project.scripts]
logreader = "logreader.cli:main"

[project.gui-scripts]
logreader-gui = "logreader.qt_app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "logreader.__version__"}
